<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f7">
<title>UPS Monitor</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f7;--frame:#f8f9fb;--panel:#ffffff;--panel2:#f7f8fa;--card:#ffffff;--cardHover:#fbfcfd;
  --line:#dde2e8;--lineStrong:#cfd6de;--text:#20252b;--text2:#58616c;--muted:#8a939e;
  --accent:#1682ff;--accentSoft:rgba(22,130,255,.08);--good:#35c878;--goodSoft:rgba(53,200,120,.10);
  --bad:#e95a68;--warn:#e8a22e;--input:#fff;--chartGrid:#e2e6eb;--chartLabel:#8b939d;
  --shadow:0 8px 24px rgba(29,43,61,.055);--radius:12px;
  --heroBlue:rgba(22,130,255,.10);--heroGreen:rgba(53,200,120,.08);--device:#262a2f;--device2:#16191d;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1014;--frame:#12161b;--panel:#1b1f24;--panel2:#20252a;--card:#1b1f24;--cardHover:#20252a;
  --line:#343a41;--lineStrong:#454c54;--text:#f1f3f5;--text2:#bdc3ca;--muted:#8c939c;
  --accent:#1682ff;--accentSoft:rgba(22,130,255,.10);--good:#5ddc8a;--goodSoft:rgba(93,220,138,.10);
  --bad:#ff6977;--warn:#f1ab35;--input:#14181d;--chartGrid:#343a41;--chartLabel:#858c95;
  --shadow:none;--heroBlue:rgba(22,130,255,.18);--heroGreen:rgba(93,220,138,.11);--device:#24282d;--device2:#101317;
}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}html{background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);transition:background .2s,color .2s}
button,input{font:inherit;color:inherit}button{border:0}.app{min-height:100vh}.main{width:min(1510px,100%);margin:auto;padding:18px 20px 28px}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:12px;padding:0 4px}
.pageHeading{margin:0;font-size:22px;line-height:1;font-weight:720;letter-spacing:-.4px}.topActions{display:flex;align-items:center;gap:9px}
.connBadge{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:9px;color:var(--text2);font-size:12px;font-weight:650;box-shadow:var(--shadow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(233,90,104,.10)}.dot.ok{background:var(--good);box-shadow:0 0 0 3px var(--goodSoft)}
.themeToggle{height:34px;display:flex;align-items:center;padding:3px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;box-shadow:var(--shadow)}
.themeBtn{width:29px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted);transition:.15s}.themeBtn.active{color:var(--accent);background:var(--accentSoft)}
.dashboard{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;padding:18px;background:var(--frame);border:1px solid var(--line);border-radius:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{grid-column:1/-1;display:grid;grid-template-columns:minmax(480px,1.18fr) minmax(650px,1.45fr);gap:14px}
.summary{position:relative;min-height:292px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:center;padding:20px 22px;overflow:hidden;background:radial-gradient(circle at 34% 46%,var(--heroBlue),transparent 37%),radial-gradient(circle at 62% 64%,var(--heroGreen),transparent 34%),var(--panel);border:1px solid var(--lineStrong);border-radius:var(--radius);box-shadow:var(--shadow)}
.upsVisual{height:225px;display:grid;place-items:center;position:relative}.upsGlow{position:absolute;width:175px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--heroBlue),transparent 68%);filter:blur(9px)}
.upsTower{width:118px;height:208px;border-radius:20px;position:relative;background:linear-gradient(100deg,var(--device2),var(--device) 30%,#34393f 54%,var(--device) 68%,var(--device2));border:1px solid rgba(115,124,134,.36);box-shadow:0 17px 26px rgba(0,0,0,.20),inset 12px 0 18px rgba(255,255,255,.025),inset -8px 0 12px rgba(0,0,0,.26)}
.upsTower:before{content:"";position:absolute;inset:0 auto 0 16px;width:1px;background:rgba(255,255,255,.08)}.upsPower{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#76d65e;background:#171b1d;border:1px solid #505961;box-shadow:0 0 0 3px rgba(82,95,102,.12)}
.upsBrand{position:absolute;top:82px;left:0;right:0;text-align:center;color:#a9b0b7;font-size:14px;font-weight:800;font-style:italic;letter-spacing:.3px}.upsLed{position:absolute;right:10px;bottom:20px;width:4px;height:48px;border-radius:4px;background:#57e75c;box-shadow:0 0 8px rgba(87,231,92,.85)}
.summaryInfo{min-width:0;position:relative}.onlineTiny{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:12px;margin-bottom:18px}.onlineTiny span{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}.onlineTiny.off span{background:var(--bad);box-shadow:0 0 8px rgba(233,90,104,.55)}
.heroValue{font-size:64px;font-weight:750;letter-spacing:-3px;line-height:.95}.stateRow{display:flex;align-items:center;gap:8px;margin:17px 0 12px}.stateIcon{display:none}.stateText{font-size:19px;font-weight:680;color:var(--good)}
.model{max-width:360px;font-size:13px;line-height:1.55;color:var(--text2);overflow-wrap:anywhere}.updated{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;margin-top:16px}.summaryConnect{display:inline-flex;margin-top:10px;height:30px;align-items:center;padding:0 10px;border-radius:6px;border:1px solid color-mix(in srgb,var(--good) 36%,transparent);background:var(--goodSoft);color:var(--good);font-size:11px;font-weight:650}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{min-height:141px;padding:17px 18px;border:1px solid var(--lineStrong);border-radius:11px;background:var(--card);box-shadow:var(--shadow);transition:.15s}.metric:hover{background:var(--cardHover)}
.metricIcon{float:left;width:36px;height:36px;border-radius:50%;margin-right:10px;display:grid;place-items:center;color:var(--accent);background:var(--accentSoft);border:1px solid color-mix(in srgb,var(--accent) 15%,transparent)}.metric .k{padding-top:9px;font-size:12px;color:var(--muted);margin-bottom:17px}.metric .v{clear:both;font-size:30px;font-weight:560;margin-left:47px;color:var(--text);letter-spacing:-.5px;white-space:nowrap}.miniBar{display:block;height:5px;margin:15px 0 0 47px;border-radius:5px;background:var(--line);overflow:hidden}.miniBar span{display:block;height:100%;width:0;background:var(--accent);border-radius:5px;transition:width .4s}
.chart{grid-column:span 7;padding:20px 22px}.events{grid-column:span 5;padding:20px 22px}.settings{grid-column:1/-1;padding:0;overflow:hidden}.panelTitle{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.panelHeading{display:flex;align-items:center;gap:8px}.panelHeading h2,.settingsHeader h2{font-size:16px;margin:0;font-weight:660}.headIcon{display:none}.chartLegend{display:flex;gap:14px;font-size:11px;color:var(--muted)}.legend{display:flex;align-items:center;gap:6px}.legend:before{content:"";width:16px;height:3px;background:var(--good);border-radius:3px}.legend.load:before{background:var(--accent)}
.canvasBox{height:282px}.canvasBox canvas{width:100%;height:100%;display:block}.eventList{height:282px;overflow:auto}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}.emptyIcon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;border:1px solid var(--lineStrong);background:var(--panel2);color:var(--muted)}.empty strong{display:block;font-size:15px;color:var(--text2);font-weight:650}.empty p{font-size:12px;margin:6px 0 0}.event{padding:12px 4px;border-bottom:1px solid var(--line)}.event .t{font-size:11px}.event .m{font-size:13px;margin-top:4px;line-height:1.4}.sev-critical .m{color:var(--bad)}.sev-warning .m{color:var(--warn)}
.secondary,.primary{height:34px;border-radius:8px;padding:0 12px;cursor:pointer;border:1px solid var(--lineStrong);background:var(--panel2);font-size:12px;font-weight:650}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary:hover{background:var(--cardHover)}
.settingsHeader{height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.settingsHeaderLeft{display:flex;align-items:center;gap:9px}.settingsHeader .headIcon{display:grid;width:30px;height:30px;border-radius:9px;place-items:center;color:var(--accent);background:var(--accentSoft)}.settingsHeader .chevron{color:var(--muted);transition:.2s}.settings.collapsed .chevron{transform:rotate(-90deg)}.settingsBody{padding:0 20px 20px;border-top:1px solid var(--line)}.settings.collapsed .settingsBody{display:none}.settings form{padding-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.settings label{font-size:12px;color:var(--muted);display:grid;gap:6px}.settings input{width:100%;height:38px;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:0 11px;outline:0}.settings input:focus{border-color:var(--accent)}.settings .wide{grid-column:span 2}.actions{grid-column:1/-1;display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:2px}.muted{color:var(--muted)}.notice{margin-top:16px;padding:10px 12px;background:rgba(232,162,46,.08);border:1px solid rgba(232,162,46,.23);border-radius:8px;font-size:12px}.hide{display:none!important}
@media(max-width:1120px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.chart,.events{grid-column:1/-1}.summary{grid-template-columns:190px 1fr}}
@media(max-width:760px){.main{padding:12px}.dashboard{padding:12px;gap:12px}.topbar{height:42px}.connBadge{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:150px 1fr;padding:15px}.upsVisual{height:185px}.upsTower{transform:scale(.83)}.heroValue{font-size:52px}.settings form{grid-template-columns:1fr}.settings .wide{grid-column:auto}}
@media(max-width:520px){.pageHeading{font-size:19px}.metrics{grid-template-columns:1fr}.summary{grid-template-columns:1fr;text-align:center}.upsVisual{display:none}.onlineTiny,.stateRow,.updated{justify-content:center}.model{margin:auto}.chart,.events{padding:16px}.canvasBox,.eventList{height:230px}}
</style>
</head>
<body>
<div class="app"><div class="main">
  <header class="topbar">
    <h1 class="pageHeading">概览</h1>
    <div class="topActions">
      <div class="connBadge"><span id="dot" class="dot"></span><span id="conn">未连接</span></div>
      <button id="themeToggle" class="themeToggle" type="button" aria-label="切换亮色或暗色主题">
        <span id="sunBtn" class="themeBtn active" title="亮色"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <span id="moonBtn" class="themeBtn" title="暗色"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      </button>
    </div>
  </header>

  <main id="overview" class="dashboard">
    <section class="hero">
      <div class="summary">
        <div class="upsVisual"><div class="upsGlow"></div><div class="upsTower"><div class="upsPower"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v8M7.2 6.8a7 7 0 1 0 9.6 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="upsBrand">APC</div><div class="upsLed"></div></div></div>
        <div class="summaryInfo"><div id="onlineStatus" class="onlineTiny"><span></span><b id="onlineText" style="font-weight:560">正在连接</b></div><div id="charge" class="heroValue">--%</div><div class="stateRow"><span id="state" class="stateText">正在连接</span></div><div id="model" class="model">正在读取 UPS 信息…</div><div id="updated" class="updated">--</div><span id="summaryConn" class="summaryConnect">未连接</span></div>
      </div>
      <div class="metrics">
        <article class="metric"><div class="metricIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 16a8 8 0 1 1 16 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m12 12 4-4M5 16h2M17 16h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><div class="k">负载</div><div id="load" class="v">--%</div><div class="miniBar"><span id="loadBar"></span></div></div></article>
        <article class="metric"><div class="metricIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3.2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><div class="k">预计续航</div><div id="runtime" class="v">--</div></div></article>
        <article class="metric"><div class="metricIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 12c2.2-5.2 4.5-5.2 6.7 0s4.5 5.2 6.7 0 4.5-5.2 4.6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><div class="k">输入电压</div><div id="vin" class="v">-- V</div></div></article>
        <article class="metric"><div class="metricIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M9 10v3M15 10v3M9 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><div><div class="k">输出电压</div><div id="vout" class="v">-- V</div></div></article>
        <article class="metric"><div class="metricIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="7" y="5" width="10" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M10 2h4v3M13 9l-3 4h3l-2 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="k">电池电压</div><div id="vbat" class="v">-- V</div></div></article>
        <article class="metric"><div class="metricIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 13h4l2-7 4 13 2-7h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="k">输入频率</div><div id="freq" class="v">-- Hz</div></div></article>
      </div>
    </section>

    <section id="history" class="panel chart"><div class="panelTitle"><div class="panelHeading"><h2>24 小时趋势</h2></div><div class="chartLegend"><span class="legend">电量 (%)</span><span class="legend load">负载 (%)</span></div></div><div class="canvasBox"><canvas id="chart"></canvas></div></section>
    <section id="eventsPanel" class="panel events"><div class="panelTitle"><div class="panelHeading"><h2>最近事件</h2></div><button class="secondary" type="button" onclick="loadEvents()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px;margin-right:4px"><path d="M20 6v5h-5M4 18v-5h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.2 10A7 7 0 0 0 6 6.8L4 11M5.8 14A7 7 0 0 0 18 17.2l2-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>刷新</button></div><div id="events" class="eventList"><div class="empty"><div><div class="emptyIcon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M6 4h12v16H6z" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><strong>暂无事件</strong><p>当前没有新的事件记录</p></div></div></div></section>

    <section id="settingsPanel" class="panel settings collapsed"><div class="settingsHeader" onclick="toggleSettings()"><div class="settingsHeaderLeft"><span class="headIcon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M19 13.4v-2.8l-2-.7a6 6 0 0 0-.7-1.7l.9-1.9-2-2-1.9.9a6 6 0 0 0-1.7-.7l-.7-2H8.1l-.7 2a6 6 0 0 0-1.7.7l-1.9-.9-2 2 .9 1.9A6 6 0 0 0 2 9.9l-2 .7v2.8l2 .7a6 6 0 0 0 .7 1.7l-.9 1.9 2 2 1.9-.9a6 6 0 0 0 1.7.7l.7 2h2.8l.7-2a6 6 0 0 0 1.7-.7l1.9.9 2-2-.9-1.9a6 6 0 0 0 .7-1.7l2-.7Z" transform="translate(2 0) scale(.83)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><h2>连接与告警设置</h2><span id="adminTag" class="muted" style="font-size:11px"></span></div><svg class="chevron" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="settingsBody"><div id="adminNotice" class="notice hide">当前账号不是 fnOS 管理员，只能查看监控数据。</div><form id="form"><label>NUT 主机<input id="host" value="127.0.0.1"></label><label>NUT 端口<input id="port" type="number" value="3493"></label><label>UPS 名称<input id="ups" placeholder="留空自动选择"></label><label>轮询间隔（秒）<input id="poll" type="number" min="5" value="10"></label><label>历史保留（天）<input id="retention" type="number" min="1" value="30"></label><label>低电量阈值（%）<input id="low" type="number" min="1" max="99" value="25"></label><label class="wide">Webhook URL<input id="webhook" placeholder="可选，POST JSON 通知"></label><div class="actions"><button type="button" class="secondary" id="testBtn" onclick="testNut()">测试连接</button><button type="button" class="primary" id="saveBtn" onclick="saveConfig()">保存设置</button><button type="button" class="secondary" id="webhookBtn" onclick="testWebhook()">测试 Webhook</button><span id="msg" class="muted"></span></div></form></div></section>
  </main>
</div></div>
<script>
const BASE=location.pathname.startsWith('/app/fnos-ups-monitor')?'/app/fnos-ups-monitor':'';let isAdmin=false;
const $=id=>document.getElementById(id);const api=(p,o)=>fetch(BASE+p,o).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j});
const fmt=(v,suffix='')=>v===null||v===undefined?'--'+suffix:(Math.round(v*10)/10)+suffix;function runtime(v){if(v==null)return'--';let m=Math.round(v/60);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+' min'}
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('ups-monitor-theme',theme);$('sunBtn').classList.toggle('active',theme==='light');$('moonBtn').classList.toggle('active',theme==='dark');document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='dark'?'#0d1014':'#f3f5f7');requestAnimationFrame(loadChart)}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
(function initTheme(){setTheme(localStorage.getItem('ups-monitor-theme')||'light')})();$('themeToggle').addEventListener('click',toggleTheme);
function toggleSettings(){$('settingsPanel').classList.toggle('collapsed')}
async function refresh(){try{let s=await api('/api/status');isAdmin=!!s.viewer?.is_admin;const ok=!!s.connected;$('dot').className='dot'+(ok?' ok':'');$('conn').textContent=ok?'已连接':'未连接';$('summaryConn').textContent=ok?'已连接':'未连接';$('charge').textContent=fmt(s.charge,'%');$('onlineStatus').classList.toggle('off',!ok);$('onlineText').textContent=ok?'在线运行':'连接异常';$('state').textContent=ok?s.status_text:(s.error||'连接失败');$('state').style.color=ok?'var(--good)':'var(--bad)';const model=ok?([s.ups_mfr,s.ups_model].filter(Boolean).join(' ')||s.ups_name):'请检查 NUT 设置';$('model').textContent=model;$('updated').innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>更新时间 '+new Date(s.ts*1000).toLocaleString()+'</span>';$('load').textContent=fmt(s.load,'%');$('loadBar').style.width=Math.max(0,Math.min(100,s.load||0))+'%';$('runtime').textContent=runtime(s.runtime);$('vin').textContent=fmt(s.input_voltage,' V');$('vout').textContent=fmt(s.output_voltage,' V');$('vbat').textContent=fmt(s.battery_voltage,' V');$('freq').textContent=fmt(s.input_frequency,' Hz');applyAdmin();}catch(e){$('conn').textContent='页面通信失败';$('onlineStatus').classList.add('off');$('onlineText').textContent='通信失败'}}
function applyAdmin(){$('adminTag').textContent=isAdmin?'管理员':'只读';$('adminNotice').classList.toggle('hide',isAdmin);for(const el of document.querySelectorAll('#form input,#form button'))el.disabled=!isAdmin;if(isAdmin&&!window.configLoaded){loadConfig();window.configLoaded=true}}
async function loadConfig(){try{let c=await api('/api/config');$('host').value=c.nut_host;$('port').value=c.nut_port;$('ups').value=c.ups_name;$('poll').value=c.poll_interval;$('retention').value=c.retention_days;$('low').value=c.low_battery_threshold;$('webhook').value=c.webhook_url}catch(e){msg(e.message)}}
function body(){return{nut_host:$('host').value,nut_port:+$('port').value,ups_name:$('ups').value,poll_interval:+$('poll').value,retention_days:+$('retention').value,low_battery_threshold:+$('low').value,webhook_url:$('webhook').value}}
function msg(t){$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',4000)}async function saveConfig(){try{await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body())});msg('已保存，下一轮采集生效')}catch(e){msg(e.message)}}async function testNut(){try{let r=await api('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body())});msg('连接成功：'+r.ups.map(x=>x.name).join(', '))}catch(e){msg('连接失败：'+e.message)}}async function testWebhook(){try{await api('/api/webhook/test',{method:'POST'});msg('测试通知已发送')}catch(e){msg(e.message)}}
function emptyEvents(){return '<div class="empty"><div><div class="emptyIcon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M6 4h12v16H6z" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h6M9 13h6M9 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><strong>暂无事件</strong><p>当前没有新的事件记录</p></div></div>'}
async function loadEvents(){try{let r=await api('/api/events?limit=80');$('events').innerHTML=r.items.length?r.items.map(e=>`<div class="event sev-${e.severity}"><div class="t muted">${new Date(e.ts*1000).toLocaleString()} · ${esc(e.severity)}</div><div class="m">${esc(e.message)}</div></div>`).join(''):emptyEvents()}catch(e){}}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}async function loadChart(){try{let r=await api('/api/history?hours=24');drawChart(r.items)}catch(e){drawChart([])}}function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function drawChart(a){const c=$('chart'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);const left=44,right=12,top=14,bottom=30,pw=w-left-right,ph=h-top-bottom;x.font='11px system-ui';x.textAlign='right';x.textBaseline='middle';for(let i=0;i<=5;i++){const val=100-i*20,y=top+ph*i/5;x.strokeStyle=css('--chartGrid');x.lineWidth=1;x.beginPath();x.moveTo(left,y);x.lineTo(w-right,y);x.stroke();x.fillStyle=css('--chartLabel');x.fillText(val+'%',left-8,y)}const now=Date.now()/1000,start=now-86400;x.textAlign='center';x.textBaseline='top';for(let i=0;i<=6;i++){const t=start+86400*i/6,px=left+pw*i/6;const d=new Date(t*1000),label=String(d.getHours()).padStart(2,'0')+':00';x.fillStyle=css('--chartLabel');x.fillText(label,px,h-bottom+9)}if(!a||a.length<2){x.textAlign='center';x.textBaseline='middle';x.fillStyle=css('--muted');x.font='12px system-ui';x.fillText('采集一段时间后显示趋势',left+pw/2,top+ph/2);return}let t0=Math.min(...a.map(v=>v.ts)),t1=Math.max(...a.map(v=>v.ts));if(t1<=t0)t1=t0+1;function line(key,color,area){let pts=[];a.forEach(p=>{if(p[key]==null)return;let px=left+(p.ts-t0)/(t1-t0)*pw,py=top+(100-Math.max(0,Math.min(100,p[key])))/100*ph;pts.push([px,py])});if(pts.length<2)return;if(area){const g=x.createLinearGradient(0,top,0,top+ph);g.addColorStop(0,color+(document.documentElement.dataset.theme==='dark'?'12':'18'));g.addColorStop(1,color+'00');x.beginPath();x.moveTo(pts[0][0],top+ph);pts.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(pts[pts.length-1][0],top+ph);x.closePath();x.fillStyle=g;x.fill()}x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.strokeStyle=color;x.lineWidth=2;x.lineJoin='round';x.lineCap='round';x.stroke();if(pts.length){const p=pts[pts.length-1];x.beginPath();x.arc(p[0],p[1],3.5,0,Math.PI*2);x.fillStyle=color;x.fill()}}line('charge',css('--good'),true);line('load',css('--accent'),false)}
refresh();loadEvents();loadChart();setInterval(refresh,5000);setInterval(loadEvents,30000);setInterval(loadChart,60000);addEventListener('resize',()=>requestAnimationFrame(loadChart));
</script>
</body></html>
